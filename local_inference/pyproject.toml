[project]
name = "bridge-local-inference"
version = "0.1.0"
description = "Local inference for the Qwen2.5 bridge-planning LoRA adapter"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.2,<2",
    "bitsandbytes>=0.45,<1",
    "gradio>=5.20,<6",
    "huggingface-hub>=0.29,<1",
    "peft>=0.14,<1",
    "safetensors>=0.5,<1",
    "torch>=2.6,<2.8",
    "transformers>=4.48,<5",
]

[tool.uv]
# This file only declares dependencies. No environment is created here.

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

# Run from this directory after placing local model files:
#   uv run python app.py
#   uv run python -c "from model_loader import load_model_and_tokenizer; print('loader import ok')"
